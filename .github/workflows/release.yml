name: release

# A tag vX.Y.Z publishes that version: the full CI first, then the image to GHCR (amd64 and arm64),
# the wheel and sdist, and a GitHub Release with the notes from CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the package version
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          got="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          echo "tag $want, pyproject $got"
          test "$want" = "$got"
          grep -q "^__version__ = \"$want\"$" src/vkteams_mcp/__init__.py
          grep -q "^## $want " CHANGELOG.md
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build the wheel and sdist
        run: uv build && ls -l dist
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push under a staging tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # a plain Docker manifest list with the two platforms and nothing else: provenance and SBOM
          # entries (platform unknown/unknown) made a Nexus proxy offer only arm64
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }}:sha-${{ github.sha }},push=true,oci-mediatypes=false
      - name: The staged image starts, runs unprivileged and carries this version
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          ref="$IMAGE:sha-$GITHUB_SHA"
          for platform in linux/amd64 linux/arm64; do
            docker rm -f mcp >/dev/null 2>&1 || true
            docker volume rm -f key >/dev/null 2>&1 || true
            docker volume create key >/dev/null
            openssl rand -base64 48 | docker run --rm -i --platform "$platform" -v key:/run/vkteams-mcp \
              --entrypoint sh "$ref" -c 'umask 277; cat > /run/vkteams-mcp/key'
            docker run -d --name mcp --platform "$platform" -p 127.0.0.1:8000:8000 \
              -e VKTEAMS_MCP_PUBLIC_URL=https://mcp.example.org -v key:/run/vkteams-mcp "$ref"
            for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break; sleep 2; done
            curl -fsS http://127.0.0.1:8000/healthz
            uid="$(docker exec mcp id -u)"
            test -n "$uid"
            test "$uid" != 0
            got="$(docker exec mcp python -c 'import vkteams_mcp; print(vkteams_mcp.__version__)')"
            echo "$platform: uid $uid, version $got"
            test "$got" = "$v"
            # the key file is readable by the server's user only; a failed stat fails the step
            mode="$(docker exec mcp stat -c '%a %u' /run/vkteams-mcp/key)"
            test "$mode" = "400 $uid"
          done
      - name: The staged image lists exactly amd64 and arm64, before any public tag moves
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE@${{ steps.build.outputs.digest }}" > index.json
          python3 - <<'PY'
          import json
          d = json.load(open("index.json"))
          seen = sorted(f"{m['platform']['os']}/{m['platform']['architecture']}" for m in d.get("manifests") or [])
          print(d.get("mediaType"), seen)
          assert d.get("mediaType") == "application/vnd.docker.distribution.manifest.list.v2+json", "not a manifest list"
          assert seen == ["linux/amd64", "linux/arm64"], "a registry proxy offers only what this lists"
          PY
      - name: Promote the checked image to the public tags
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "$IMAGE:$v" -t "$IMAGE:${v%.*}" -t "$IMAGE:latest" \
            "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md  # the version's section has text
          printf '\n**Image:** `%s:%s` (linux/amd64, linux/arm64)\n' "$IMAGE" "$v" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "vkteams-mcp $v" --notes-file notes.md --verify-tag

  # The chart: oci://ghcr.io/widmo-ru/charts/vkteams-mcp:<x.y.z>, after the image it points at was pushed. The CI run
  # in the `ci` job above already ran it in a kind cluster.
  chart:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # to add the chart's line to the release notes once the chart is pushed
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: package and push
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          meta=charts/vkteams-mcp/Chart.yaml
          grep -qx "version: ${version}" "$meta" || { echo "Chart.yaml is not ${version}"; exit 1; }
          grep -qx "appVersion: \"${version}\"" "$meta" || { echo "appVersion is not ${version}"; exit 1; }
          helm package charts/vkteams-mcp --destination /tmp/chart
          pkg="/tmp/chart/vkteams-mcp-${version}.tgz"
          test -s "$pkg" || { echo "no package ${pkg}"; exit 1; }
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "$pkg" "oci://ghcr.io/${OWNER}/charts"
          helm show chart "oci://ghcr.io/${OWNER}/charts/vkteams-mcp" --version "$version" | grep -qx "version: ${version}"
      - name: the release notes name the chart, now that it can be installed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release view "$TAG" --json body --jq .body > notes.md
          printf '\n**Chart:** `helm upgrade --install vkteams-mcp oci://ghcr.io/%s/charts/vkteams-mcp --version %s -f values.yaml`\n' \
            "$OWNER" "$version" >> notes.md
          gh release edit "$TAG" --notes-file notes.md

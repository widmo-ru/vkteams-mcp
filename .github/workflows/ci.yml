name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, tests, gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check src tests scripts
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Unit tests
        run: uv run pytest -q
      - name: Every guard is held by a test
        run: uv run python scripts/mutation_check.py
      - name: Tool catalogue within its token budget
        run: uv run python -m vkteams_mcp.budget --check
      - name: Tool surface matches the lock file
        run: uv run python -m vkteams_mcp.surface --check

  # The state store against real Valkey and Redis, each standalone and behind Sentinel (one master, one replica, three
  # Sentinels), from a container on the same network (scripts/state-tests.sh). VKTEAMS_TEST_REQUIRE_VALKEY=1 is set
  # there: a suite that found no Valkey fails instead of skipping.
  state:
    name: state store on Valkey and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contract suite and replica tests
        run: scripts/state-tests.sh

  # The chart renders, refuses what it must, and in a real cluster (kind, on this GitHub-hosted runner) runs three replicas on Valkey with Sentinel.
  # scripts/chart-e2e.sh counts its own checks, so a check that silently did not run fails the run.
  chart:
    name: chart, and in a cluster
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: package, chart and image carry one version
        run: |
          set -euo pipefail
          py="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          chart="$(sed -n 's/^version: //p' charts/vkteams-mcp/Chart.yaml)"
          app="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/vkteams-mcp/Chart.yaml)"
          echo "pyproject ${py}, chart ${chart}, appVersion ${app}"
          test -n "$py" && test "$py" = "$chart" && test "$py" = "$app"
          grep -q "^__version__ = \"$py\"$" src/vkteams_mcp/__init__.py
      - name: lint, render, and refuse
        run: |
          set -euo pipefail
          ok=(--set publicUrl=https://mcp.example.org --set key.existingSecret=k --set state.url=redis://valkey:6379/0)
          helm lint --strict charts/vkteams-mcp "${ok[@]}"
          helm template t charts/vkteams-mcp "${ok[@]}" > rendered.yaml
          test "$(grep -c '^kind: Deployment' rendered.yaml)" = 1
          helm template t charts/vkteams-mcp "${ok[@]}" --set ingress.enabled=true --set metrics.serviceMonitor.enabled=true \
            --set autoscaling.enabled=true --set 'state.sentinel.hosts={s:26379}' --set state.url= > full.yaml
          for kind in Ingress ServiceMonitor HorizontalPodAutoscaler PodDisruptionBudget; do
            grep -q "^kind: $kind" full.yaml || { echo "no $kind rendered"; exit 1; }
          done
          # each of these must be refused BY ITS OWN VALIDATOR: a render that fails for another reason (a typo, a type
          # error) must not count, so each case names the message it expects
          refuse() {
            want=$1
            shift
            if out=$(helm template t charts/vkteams-mcp "$@" 2>&1); then echo "rendered: $*"; exit 1; fi
            case "$out" in *"$want"*) echo "refused as it should ($want)" ;; *) echo "refused for another reason, wanted '$want':"; echo "$out"; exit 1 ;; esac
          }
          base=(--set key.existingSecret=k --set publicUrl=https://mcp.example.org)
          refuse "more than one replica needs a shared state store" "${base[@]}"
          refuse "more than one replica needs a shared state store" "${base[@]}" --set replicaCount=1 --set autoscaling.enabled=true --set autoscaling.minReplicas=2
          refuse "are both set" "${ok[@]}" --set 'state.sentinel.hosts={s:26379}'
          refuse "carries a user or password" "${ok[@]}" --set state.url=redis://u:p@valkey:6379/0
          refuse "key.existingSecret is required" "${ok[@]}" --set key.existingSecret=
          refuse "must start with https://" "${ok[@]}" --set publicUrl=http://mcp.example.org
          refuse "is not an explicit path" "${ok[@]}" --set 'ingress.paths={/}'
          refuse "must be another port than 8000" "${ok[@]}" --set metrics.port=8000
          refuse "is not an address or a CIDR" "${ok[@]}" --set 'trustedProxies={not-a-cidr}'
          refuse "is set by the chart" "${ok[@]}" --set metrics.serviceMonitor.labels.app\\.kubernetes\\.io/instance=x
          # memory mode is one pod with Recreate; a store is a rolling update
          helm template t charts/vkteams-mcp "${base[@]}" --set replicaCount=1 | grep -q 'type: Recreate'
          helm template t charts/vkteams-mcp "${ok[@]}" | grep -q 'type: RollingUpdate'
      - name: build the image under test
        run: docker build -t vkteams-mcp:e2e .
      - name: kind cluster with the image loaded
        run: |
          set -euo pipefail
          kind create cluster --name vk-state --wait 120s
          docker pull valkey/valkey:8-alpine
          kind load docker-image vkteams-mcp:e2e valkey/valkey:8-alpine --name vk-state
      - name: the chart in the cluster
        run: IMAGE=vkteams-mcp:e2e scripts/chart-e2e.sh
      - name: what the cluster shows on failure
        if: failure()
        run: |
          kubectl -n vkteams-e2e get pods -o wide || true
          kubectl -n vkteams-e2e describe pods | tail -120 || true
          kubectl -n vkteams-e2e logs -l app.kubernetes.io/instance=e2e --all-containers --tail=60 || true

  image:
    name: image builds and answers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY_BYTES: 48  # random bytes in the sealing key the probes generate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t vkteams-mcp:ci .
      - name: Start and probe
        run: |
          set -euo pipefail
          # the key arrives as a file, as an init container leaves it; it is piped, never in a variable
          # (kept on the runner only so the next step can look for it by value)
          openssl rand -base64 "$KEY_BYTES" | tr -d '\n' > "$RUNNER_TEMP/key"
          docker volume create key-mcp >/dev/null
          docker run --rm -i -v key-mcp:/run/vkteams-mcp --entrypoint sh vkteams-mcp:ci \
            -c 'umask 277; cat > /run/vkteams-mcp/key' < "$RUNNER_TEMP/key"
          docker run -d --name mcp -p 127.0.0.1:8000:8000 \
            -e VKTEAMS_MCP_PUBLIC_URL=https://mcp.example.org -v key-mcp:/run/vkteams-mcp \
            vkteams-mcp:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          # the OAuth metadata names the public address, so the server read its configuration
          curl -fsS http://127.0.0.1:8000/.well-known/oauth-authorization-server | grep -q '"issuer":"https://mcp.example.org"'
          # the process runs as the image's configured user, and that user is not root
          want="$(docker inspect -f '{{.Config.User}}' vkteams-mcp:ci)"
          got="$(docker exec mcp id -u)"
          echo "image user: ${want:-<none>}, running as uid: $got"
          test -n "$want" && test "$got" = "$want" && test "$got" != 0
      - name: The key is in its 0400 file and nowhere else, and survives a restart
        run: |
          set -euo pipefail
          # the file stays for a restart, readable by the server's user only
          got="$(docker exec mcp stat -c '%a %u' /run/vkteams-mcp/key)"
          echo "key file: mode and owner $got"
          test "$got" = "400 $(docker exec mcp id -u)"
          # look for the key by value in what `kubectl exec` can see: env, the log
          # the reference is the base64 of KEY_BYTES random bytes, or nothing below is checked
          test "$(wc -c < "$RUNNER_TEMP/key" | tr -d ' ')" = "$(( 4 * ((KEY_BYTES + 2) / 3) ))"
          docker exec mcp env > env.txt
          docker logs mcp > log.txt 2>&1
          grep -q '^VKTEAMS_MCP_PUBLIC_URL=' env.txt  # the environment really was read
          grep -q 'session manager started' log.txt
          for f in env.txt log.txt; do
            # grep: 0 found, 1 not found, anything else is a check that did not run
            rc=0; grep -qF -f "$RUNNER_TEMP/key" "$f" || rc=$?
            echo "$f: $(wc -l < "$f") lines, grep $rc"
            test "$rc" = 1
          done
          rm -f env.txt log.txt "$RUNNER_TEMP/key"
          # non-dumpable: a process of the same user may not read the server's /proc entries. The kernel checks
          # environ and mem the same way, and environ reads from offset 0, so a refusal there is the flag at work.
          # (`a && b` cannot fail a step under set -e: each check is its own line.)
          rc=0; docker exec mcp cat /proc/1/environ >/dev/null 2>err.txt || rc=$?
          echo "reading the server's /proc/1/environ as its own user: exit $rc, $(cat err.txt)"
          test "$rc" != 0
          grep -q 'Permission denied' err.txt
          rm -f err.txt
          # a container restart reads the same file: a registration from before still signs in
          cid="$(curl -fsS -H 'Host: mcp.example.org' -H 'Content-Type: application/json' \
            -d '{"redirect_uris":["https://client.example.org/cb"],"token_endpoint_auth_method":"none","grant_types":["authorization_code","refresh_token"],"response_types":["code"]}' \
            http://127.0.0.1:8000/register | python3 -c 'import json,sys; print(json.load(sys.stdin)["client_id"])')"
          docker restart mcp >/dev/null
          for _ in $(seq 1 30); do curl -fsS -m 2 http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break; sleep 1; done
          code="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: mcp.example.org' \
            "http://127.0.0.1:8000/authorize?response_type=code&client_id=$cid&redirect_uri=https%3A%2F%2Fclient.example.org%2Fcb&state=s&code_challenge=$(printf 'x%.0s' {1..43})&code_challenge_method=S256")"
          echo "after a restart: $code"
          case "$code" in 302\ https://mcp.example.org/signin?request=*) ;; *) exit 1 ;; esac
      - name: A VKTEAMS_MCP_SECRET variable is refused, in JSON, with exit code 2
        run: |
          set -euo pipefail
          rc=0
          docker run --name legacy -e VKTEAMS_MCP_PUBLIC_URL=https://mcp.example.org \
            -e VKTEAMS_MCP_SECRET="$(openssl rand -base64 48)" vkteams-mcp:ci >legacy.out 2>&1 || rc=$?
          echo "exit code $rc"
          cat legacy.out
          test "$rc" = 2
          test "$(wc -l < legacy.out)" -gt 0
          python3 -c 'import json,sys; [json.loads(l) for l in open("legacy.out") if l.strip()]'
          grep -q 'VKTEAMS_MCP_SECRET is no longer accepted' legacy.out
      - name: No HIGH or CRITICAL vulnerability in the image
        run: |
          set -euo pipefail
          trivy="aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$trivy" image --quiet \
            --severity CRITICAL,HIGH --list-all-pkgs --format json vkteams-mcp:ci > trivy.json
          python3 - <<'PY'
          import json
          d = json.load(open("trivy.json"))
          os_ = (d.get("Metadata") or {}).get("OS") or {}
          results = d.get("Results") or []
          found = [v for r in results for v in r.get("Vulnerabilities") or []]
          fixable = [v for v in found if v.get("FixedVersion")]
          print(f"trivy: {os_.get('Family')} {os_.get('Name')}, {len(results)} targets, "
                f"{len(found)} HIGH/CRITICAL, {len(fixable)} with a fix")
          for v in found:
              print(f"  {v['Severity']} {v['PkgName']} {v['VulnerabilityID']} fixed in {v.get('FixedVersion') or '-'}")
          # a scan that saw no operating system or none of the Python dependencies proves nothing
          os_pkgs = [p for r in results if r.get("Class") == "os-pkgs" for p in r.get("Packages") or []]
          py_pkgs = {p["Name"].lower() for r in results if r.get("Class") == "lang-pkgs" for p in r.get("Packages") or []}
          print(f"trivy saw {len(os_pkgs)} system packages and {len(py_pkgs)} Python packages")
          assert os_.get("Family") and os_pkgs, "trivy saw no system packages"
          assert {"cryptography", "pydantic", "mcp"} <= py_pkgs, "trivy did not see the Python dependencies"
          # every finding counts, fixed upstream or not: a company scanner in front of its registry counts them
          # all, and the Debian base passed a fixable-only gate with 101 findings and no fix for any of them
          assert not found, "HIGH or CRITICAL findings in the image"
          PY
      - name: Two replicas share nothing but the key
        run: |
          set -euo pipefail
          # one key, as one deploy's Secret, copied to each replica the way each pod's init container does
          openssl rand -base64 48 | tr -d '\n' > key.txt
          for n in 1 2; do
            docker volume create "key-r$n" >/dev/null
            docker run --rm -i -v "key-r$n:/run/vkteams-mcp" --entrypoint sh vkteams-mcp:ci \
              -c 'umask 277; cat > /run/vkteams-mcp/key' < key.txt
            docker run -d --name "r$n" -p "127.0.0.1:800$n:8000" \
              -e VKTEAMS_MCP_PUBLIC_URL=https://mcp.example.org -v "key-r$n:/run/vkteams-mcp" vkteams-mcp:ci
          done
          rm key.txt
          for n in 1 2; do
            up=""
            for _ in $(seq 1 30); do
              if curl -fsS -m 2 "http://127.0.0.1:800$n/healthz" >/dev/null 2>&1; then up=1; break; fi
              sleep 1
            done
            test -n "$up" || { echo "replica $n never answered /healthz"; docker logs "r$n"; exit 1; }
          done
          # register on replica one: the registration comes back as the client id
          cid="$(curl -fsS -H 'Host: mcp.example.org' -H 'Content-Type: application/json' \
            -d '{"redirect_uris":["https://client.example.org/cb"],"token_endpoint_auth_method":"none","grant_types":["authorization_code","refresh_token"],"response_types":["code"]}' \
            http://127.0.0.1:8001/register | python3 -c 'import json,sys; print(json.load(sys.stdin)["client_id"])')"
          # replica two knows the client without ever having seen it: authorize sends the browser to sign in
          code="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: mcp.example.org' \
            "http://127.0.0.1:8002/authorize?response_type=code&client_id=$cid&redirect_uri=https%3A%2F%2Fclient.example.org%2Fcb&state=s&code_challenge=$(printf 'x%.0s' {1..43})&code_challenge_method=S256")"
          echo "replica two: $code"
          case "$code" in 302\ https://mcp.example.org/signin?request=*) ;; *) exit 1 ;; esac
          # and a client id it did not issue is refused with a page for the person, not a redirect
          bad="$(curl -s -m 5 -w ' %{http_code} %{redirect_url}' -H 'Host: mcp.example.org' -H 'Accept-Language: en' \
            "http://127.0.0.1:8002/authorize?response_type=code&client_id=made-up&redirect_uri=https%3A%2F%2Fclient.example.org%2Fcb&state=s&code_challenge=$(printf 'x%.0s' {1..43})&code_challenge_method=S256")"
          echo "made-up client: ${bad##*</html>}"
          case "$bad" in *'<h1>Connect again</h1>'*'</html> 400 ') ;; *) exit 1 ;; esac
      - name: Server log
        if: always()
        run: docker logs mcp 2>&1 | tail -50 || true

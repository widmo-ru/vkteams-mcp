name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, tests, gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check src tests scripts
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Unit tests
        run: uv run pytest -q
      - name: Every guard is held by a test
        run: uv run python scripts/mutation_check.py
      - name: Tool catalogue within its token budget
        run: uv run python -m vkteams_mcp.budget --check
      - name: Tool surface matches the lock file
        run: uv run python -m vkteams_mcp.surface --check

  image:
    name: image builds and answers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t vkteams-mcp:ci .
      - name: Start and probe
        run: |
          set -euo pipefail
          # the key arrives as a file, as an init container leaves it; it is piped, never in a variable
          # (kept on the runner only so the next step can look for it by value)
          openssl rand -base64 48 | tr -d '\n' > "$RUNNER_TEMP/key"
          docker volume create key-mcp >/dev/null
          docker run --rm -i -v key-mcp:/run/vkteams-mcp --entrypoint sh vkteams-mcp:ci \
            -c 'umask 277; cat > /run/vkteams-mcp/key' < "$RUNNER_TEMP/key"
          docker run -d --name mcp -p 127.0.0.1:8000:8000 \
            -e VKTEAMS_MCP_PUBLIC_URL=https://mcp.example.org -v key-mcp:/run/vkteams-mcp \
            vkteams-mcp:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          # the OAuth metadata names the public address, so the server read its configuration
          curl -fsS http://127.0.0.1:8000/.well-known/oauth-authorization-server | grep -q '"issuer":"https://mcp.example.org"'
          # the process runs as the image's configured user, and that user is not root
          want="$(docker inspect -f '{{.Config.User}}' vkteams-mcp:ci)"
          got="$(docker exec mcp id -u)"
          echo "image user: ${want:-<none>}, running as uid: $got"
          test -n "$want" && test "$got" = "$want" && test "$got" != 0
      - name: The key is read once and left nowhere
        run: |
          set -euo pipefail
          # the file is gone, and the server still serves: the key is in its memory and nowhere else
          left="$(docker exec mcp ls -A /run/vkteams-mcp)"
          echo "left in /run/vkteams-mcp: ${left:-nothing}"
          test -z "$left"
          # look for the key by value in what `kubectl exec` can see: env, the server's environment, the log
          # the reference is the 64 characters `openssl rand -base64 48` gave, or nothing below is checked
          test "$(wc -c < "$RUNNER_TEMP/key" | tr -d ' ')" = 64
          docker exec mcp env > env.txt
          docker exec mcp sh -c 'tr "\0" "\n" < /proc/1/environ' > environ.txt
          docker logs mcp > log.txt 2>&1
          for f in env.txt environ.txt; do grep -q '^VKTEAMS_MCP_PUBLIC_URL=' "$f"; done  # each was really read
          grep -q 'session manager started' log.txt
          for f in env.txt environ.txt log.txt; do
            # grep: 0 found, 1 not found, anything else is a check that did not run
            rc=0; grep -qF -f "$RUNNER_TEMP/key" "$f" || rc=$?
            echo "$f: $(wc -l < "$f") lines, grep $rc"
            test "$rc" = 1
          done
          rm -f env.txt environ.txt log.txt "$RUNNER_TEMP/key"
          curl -fsS http://127.0.0.1:8000/healthz
          # a container started again without the file says what to do and stops, rather than serving
          docker restart mcp >/dev/null
          for _ in $(seq 1 20); do test "$(docker inspect -f '{{.State.Status}}' mcp)" = exited && break; sleep 1; done
          docker inspect -f 'restarted without the key: {{.State.Status}}, exit {{.State.ExitCode}}' mcp
          test "$(docker inspect -f '{{.State.ExitCode}}' mcp)" = 2
          docker logs mcp 2>&1 | tail -1 | grep -q 'no sealing key: /run/vkteams-mcp/key does not exist'
      - name: A leftover VKTEAMS_MCP_SECRET still starts the server, with a warning
        run: |
          set -euo pipefail
          docker run -d --name legacy -p 127.0.0.1:8003:8000 \
            -e VKTEAMS_MCP_PUBLIC_URL=https://mcp.example.org -e VKTEAMS_MCP_SECRET="$(openssl rand -base64 48)" \
            vkteams-mcp:ci
          for _ in $(seq 1 30); do curl -fsS -m 2 http://127.0.0.1:8003/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8003/healthz
          docker logs legacy 2>&1 | grep -q 'VKTEAMS_MCP_SECRET is deprecated and the next release refuses it'
      - name: No HIGH or CRITICAL vulnerability in the image
        run: |
          set -euo pipefail
          trivy="aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$trivy" image --quiet \
            --severity CRITICAL,HIGH --list-all-pkgs --format json vkteams-mcp:ci > trivy.json
          python3 - <<'PY'
          import json
          d = json.load(open("trivy.json"))
          os_ = (d.get("Metadata") or {}).get("OS") or {}
          results = d.get("Results") or []
          found = [v for r in results for v in r.get("Vulnerabilities") or []]
          fixable = [v for v in found if v.get("FixedVersion")]
          print(f"trivy: {os_.get('Family')} {os_.get('Name')}, {len(results)} targets, "
                f"{len(found)} HIGH/CRITICAL, {len(fixable)} with a fix")
          for v in found:
              print(f"  {v['Severity']} {v['PkgName']} {v['VulnerabilityID']} fixed in {v.get('FixedVersion') or '-'}")
          # a scan that saw no operating system or none of the Python dependencies proves nothing
          os_pkgs = [p for r in results if r.get("Class") == "os-pkgs" for p in r.get("Packages") or []]
          py_pkgs = {p["Name"].lower() for r in results if r.get("Class") == "lang-pkgs" for p in r.get("Packages") or []}
          print(f"trivy saw {len(os_pkgs)} system packages and {len(py_pkgs)} Python packages")
          assert os_.get("Family") and os_pkgs, "trivy saw no system packages"
          assert {"cryptography", "pydantic", "mcp"} <= py_pkgs, "trivy did not see the Python dependencies"
          # every finding counts, fixed upstream or not: a company scanner in front of its registry counts them
          # all, and the Debian base passed a fixable-only gate with 101 findings and no fix for any of them
          assert not found, "HIGH or CRITICAL findings in the image"
          PY
      - name: Two replicas share nothing but the key
        run: |
          set -euo pipefail
          # one key, as one deploy's Secret, copied to each replica the way each pod's init container does
          openssl rand -base64 48 | tr -d '\n' > key.txt
          for n in 1 2; do
            docker volume create "key-r$n" >/dev/null
            docker run --rm -i -v "key-r$n:/run/vkteams-mcp" --entrypoint sh vkteams-mcp:ci \
              -c 'umask 277; cat > /run/vkteams-mcp/key' < key.txt
            docker run -d --name "r$n" -p "127.0.0.1:800$n:8000" \
              -e VKTEAMS_MCP_PUBLIC_URL=https://mcp.example.org -v "key-r$n:/run/vkteams-mcp" vkteams-mcp:ci
          done
          rm key.txt
          for n in 1 2; do
            up=""
            for _ in $(seq 1 30); do
              if curl -fsS -m 2 "http://127.0.0.1:800$n/healthz" >/dev/null 2>&1; then up=1; break; fi
              sleep 1
            done
            test -n "$up" || { echo "replica $n never answered /healthz"; docker logs "r$n"; exit 1; }
          done
          # register on replica one: the registration comes back as the client id
          cid="$(curl -fsS -H 'Host: mcp.example.org' -H 'Content-Type: application/json' \
            -d '{"redirect_uris":["https://client.example.org/cb"],"token_endpoint_auth_method":"none","grant_types":["authorization_code","refresh_token"],"response_types":["code"]}' \
            http://127.0.0.1:8001/register | python3 -c 'import json,sys; print(json.load(sys.stdin)["client_id"])')"
          # replica two knows the client without ever having seen it: authorize sends the browser to sign in
          code="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: mcp.example.org' \
            "http://127.0.0.1:8002/authorize?response_type=code&client_id=$cid&redirect_uri=https%3A%2F%2Fclient.example.org%2Fcb&state=s&code_challenge=$(printf 'x%.0s' {1..43})&code_challenge_method=S256")"
          echo "replica two: $code"
          case "$code" in 302\ https://mcp.example.org/signin?request=*) ;; *) exit 1 ;; esac
          # and a client id it did not issue is refused with a page for the person, not a redirect
          bad="$(curl -s -m 5 -w ' %{http_code} %{redirect_url}' -H 'Host: mcp.example.org' -H 'Accept-Language: en' \
            "http://127.0.0.1:8002/authorize?response_type=code&client_id=made-up&redirect_uri=https%3A%2F%2Fclient.example.org%2Fcb&state=s&code_challenge=$(printf 'x%.0s' {1..43})&code_challenge_method=S256")"
          echo "made-up client: ${bad##*</html>}"
          case "$bad" in *'<h1>Connect again</h1>'*'</html> 400 ') ;; *) exit 1 ;; esac
      - name: Server log
        if: always()
        run: docker logs mcp 2>&1 | tail -50 || true

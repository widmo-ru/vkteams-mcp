{{- /*
The sealing key for a Helm or werf chart: a new random key on every render, so every `helm upgrade` or
`werf converge` is a new key. Put this file in the chart's templates/ next to the Deployment from
deploy/kubernetes/deployment.yaml, and add to that Deployment's pod template:

  metadata:
    annotations:
      checksum/vkteams-mcp-key: {{ include "vkteams-mcp.keyChecksum" . }}

so the pods restart and their init containers copy the new key. The key is generated inside the
template engine: it is in no values file, no --set argument and no CI log. `helm template` and
`werf render` print it, as they print every Secret; keep their output out of logs.
*/ -}}
{{- define "vkteams-mcp.key" -}}
{{- if not (hasKey .Values "_vkteamsMcpKey") -}}
{{- $_ := set .Values "_vkteamsMcpKey" (randAlphaNum 64) -}}
{{- end -}}
{{- .Values._vkteamsMcpKey -}}
{{- end -}}
{{- define "vkteams-mcp.keyChecksum" -}}
{{- include "vkteams-mcp.key" . | sha256sum -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: vkteams-mcp-key
type: Opaque
data:
  key: {{ include "vkteams-mcp.key" . | b64enc }}
